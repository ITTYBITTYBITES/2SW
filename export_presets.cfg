; export_presets.cfg TEMPLATE
;
; Copy to export_presets.cfg (which is gitignored) before building:
;     cp export_presets.cfg.template export_presets.cfg
;
; WHY GITIGNORED: a real preset carries keystore paths and, if a developer is
; careless, keystore passwords. v1 committed live AdMob ids and a Firebase key;
; this is the same class of leak. CI writes its own copy from secrets.
;
; Presets:
;   0  Android Debug    — APK, debug keystore, all architectures
;   1  Android Release  — AAB for Play, release keystore from env
;   2  Linux Debug      — headless CI smoke test
;   3  Windows Debug    — desktop playtest
;   4  macOS Debug      — desktop playtest
;   5  iOS Debug        — device test (requires macOS + Xcode)

