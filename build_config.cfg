; build_config.cfg — LOCAL SECRETS. GITIGNORED. DO NOT COMMIT.
;
; Production AdMob identifiers, extracted from the v1 workspace:
;   legacy_reference/autoloads/AdSystem.gd  lines 31-38
;   legacy_reference/store/BUILD_WALKTHROUGH.md  (corroborates App ID)
;   -- both archived: git show legacy-v1-archive:<path>
;
; v1 committed these to a public repo. Public ad units are the raw material
; for invalid-traffic attacks, which get AdMob accounts suspended — a bigger
; practical risk than the Firebase key that shipped alongside them.
;
; CI writes its own copy of this file from repository secrets.

[admob]
; Publisher: ca-app-pub-1566091161594729 (Android)
app_id      = "ca-app-pub-1566091161594729~3477752177"
banner_id   = "ca-app-pub-1566091161594729/8898589492"
rewarded_id = "ca-app-pub-1566091161594729/8515446112"

; iOS: v1 was Android-only. No iOS publisher account or ad units exist.
; Leave blank until an AdMob iOS app is created; AdManager falls back to
; Google's test units rather than serving a malformed request.
ios_app_id      = ""
ios_banner_id   = ""
ios_rewarded_id = ""

[build]
; Debug builds force test ads regardless of this flag — see Cfg.use_test_ads,
; which is derived from OS.is_debug_build() and has no setter.
force_test_ads = false
